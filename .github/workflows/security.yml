name: Security scanning

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
      - run: uv run pip-audit --strict -r /tmp/requirements.txt

  node-dependencies:
    name: Node dependency audit (runtime deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  container-images:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: build-only
      ENCRYPTION_KEYS: build-only
      ALLOWED_ORIGINS: https://example.invalid
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f compose.prod.yaml build
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: personal-os-backend:prod
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: personal-os-web:prod
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
