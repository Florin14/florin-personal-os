# Shared security headers (nginx does not inherit add_header into locations that define their own).
# Emotion (MUI) injects <style> tags, hence 'unsafe-inline' for styles only; scripts are 'self' only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only honoured by browsers over HTTPS (TLS is terminated in front of this container).
add_header Strict-Transport-Security "max-age=31536000" always;
